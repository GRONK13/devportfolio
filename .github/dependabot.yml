version: 2
updates:
  - package-ecosystem: npm # covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing fresh releases (malware is usually caught within days).
    # Security updates ignore the cooldown and arrive immediately.
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 3
