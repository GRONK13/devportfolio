name: Sync generated files

# Keeps files generated from content/ up to date (docs/development.md#generated-files):
# the profile README on every content change, and project covers (live screenshots) weekly.
on:
  push:
    branches: [main, v5-redesign]
    paths: ["content/**"]
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated files

concurrency:
  group: sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture live screenshots
        if: github.event_name != 'push'
        run: pnpm screenshots
        continue-on-error: true # a site being down keeps its old cover
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: pnpm readme
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md public/media/projects
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Sync README and project screenshots from content"
            git push
          fi
