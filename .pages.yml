# Pages CMS (https://pagescms.org): edit /content from the browser or a phone.
# Saving commits to GitHub; Vercel rebuilds, and the build's schema check rejects bad edits.
# Field rules mirror lib/content/schemas.ts. Keep the two in sync when adding fields.

media:
  input: public/media
  output: /media

content:
  - name: profile
    label: Profile
    type: file
    path: content/profile.yaml
    fields:
      - { name: name, label: Display name, type: string, required: true }
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: role, type: string, required: true }
      - name: headline
        type: string
        required: true
        description: Wrap one or two words in *asterisks* for the accent style.
      - { name: intro, type: text, required: true, description: Two sentences, max 280 characters. }
      - name: availability
        type: object
        fields:
          - name: status
            type: select
            required: true
            options: { values: [open, limited, closed] }
          - { name: label, type: string, required: true }
      - { name: location, type: string, required: true }
      - { name: timezone, type: string, required: true, description: IANA time zone, e.g. Asia/Manila }
      - { name: email, type: string, required: true }
      - name: socials
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: url, type: string, required: true, description: Must start with https:// }
      - name: resume
        type: object
        fields:
          - { name: file, type: string, required: true, description: Path of the PDF in public/, e.g. /gregg-marayan-resume.pdf }
          - { name: updated, type: date, options: { format: yyyy-MM-dd } }
      - name: photo
        type: object
        fields:
          - { name: src, type: image }
          - { name: alt, type: string, description: Describe the photo for screen readers. }
      - { name: about, label: About (Markdown), type: text, required: true }

  - name: now
    label: Now
    type: file
    path: content/now.yaml
    fields:
      - { name: updated, type: date, required: true, options: { format: yyyy-MM-dd } }
      - name: items
        type: object
        list: { min: 1, max: 4 }
        fields:
          - { name: label, type: string, required: true }
          - { name: text, type: string, required: true }

  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      fields: [title, order, featured]
      sort: [order]
    fields:
      - { name: title, type: string, required: true }
      - { name: summary, type: string, required: true, description: One line, max 140 characters. }
      - { name: featured, type: boolean, default: true }
      - { name: order, type: number, required: true, description: Unique; lower numbers show first. }
      - { name: color, type: string, required: true, description: 'Hex color like "#3b82f6".' }
      - name: cover
        type: object
        fields:
          - { name: src, type: image }
          - { name: alt, type: string, description: Required when there is an image. }
      - { name: stack, type: string, list: true, required: true, description: Match the names used in Skills. }
      - name: links
        type: object
        fields:
          - { name: live, type: string, description: https:// URL }
          - { name: repo, type: string, description: https:// URL }
          - { name: video, type: string, description: https:// URL }
      - name: metrics
        type: object
        list: true
        fields:
          - { name: label, type: string, required: true }
          - { name: value, type: string, required: true }
      - { name: year, type: string, pattern: '^\d{4}$' }
      - { name: role, type: string }
      - { name: team, type: string }
      - { name: body, label: Case study, type: rich-text, options: { format: markdown } }

  - name: timeline
    label: Experience & education
    type: file
    path: content/timeline.yaml
    fields:
      - name: entries
        type: object
        list: true
        fields:
          - name: kind
            type: select
            required: true
            options: { values: [work, education] }
          - { name: title, type: string, required: true }
          - { name: org, label: Organization, type: string, required: true }
          - { name: location, type: string }
          - { name: start, type: string, required: true, pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$', description: YYYY or YYYY-MM }
          - { name: end, type: string, required: true, description: YYYY, YYYY-MM or present }
          - { name: summary, type: text, required: true }
          - { name: highlights, type: string, list: true }

  - name: skills
    label: Skills
    type: file
    path: content/skills.yaml
    fields:
      - name: groups
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: note, type: string }
          - { name: items, type: string, list: true, required: true }

  - name: certifications
    label: Certifications
    type: file
    path: content/certifications.yaml
    fields:
      - name: items
        type: object
        list: true
        fields:
          - { name: name, type: string, required: true }
          - { name: issuer, type: string, required: true }
          - { name: issued, type: date, required: true, options: { format: yyyy-MM-dd } }
          - { name: expires, type: date, options: { format: yyyy-MM-dd } }
          - { name: credentialId, label: Credential ID, type: string }
          - { name: summary, type: text, required: true }
          - { name: verifyUrl, label: Verify URL, type: string, required: true, description: https:// link to the public badge }
          - { name: skills, type: string, list: true }
          - name: badge
            type: object
            fields:
              - { name: src, type: image }
              - { name: alt, type: string }

  - name: values
    label: Values
    type: file
    path: content/values.yaml
    fields:
      - name: items
        type: object
        list: true
        fields:
          - { name: title, type: string, required: true }
          - { name: description, type: text, required: true, description: Max 200 characters. }

  - name: site
    label: SEO & sharing
    type: file
    path: content/site.yaml
    fields:
      - { name: title, type: string, required: true }
      - { name: description, type: text, required: true, description: 50–170 characters. }
      - { name: keywords, type: string, list: true }
